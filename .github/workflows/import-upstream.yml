name: import-upstream

# Rewrites the newest upstream Windmill release with tools/cfgstrip, pushes it
# to the upstream-stripped branch, and opens a PR to merge it into main.
on:
  schedule:
    - cron: "0 6 * * *"   # daily, 06:00 UTC
  workflow_dispatch:

permissions:
  actions: write        # to re-enable this workflow (see below)
  contents: write
  pull-requests: write

concurrency:
  group: import-upstream
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      # GitHub pauses scheduled workflows in public repos after 60 days without
      # repository activity. Re-enabling the workflow on every run resets that
      # timer, so it keeps running as long as it runs at least once in 60 days.
      - name: Keep this schedule from being paused
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable import-upstream.yml --repo "${{ github.repository }}"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Rewrite and push the newest upstream release
        run: tools/import-upstream

      - name: Open a PR if upstream-stripped is ahead of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git fetch --quiet --tags origin main upstream-stripped
          ahead=$(git rev-list --count origin/main..origin/upstream-stripped)
          if [ "$ahead" -eq 0 ]; then
            echo "main already has everything from upstream-stripped"
            exit 0
          fi
          tag=$(git tag --points-at origin/upstream-stripped --list 'upstream/v*' | sort -V | tail -n1)
          if [ -z "$tag" ]; then
            echo "upstream-stripped isn't at a release yet; waiting for the next one"
            exit 0
          fi
          title="Import upstream Windmill ${tag#upstream/} ($ahead commits)"
          pr=$(gh pr list --head upstream-stripped --base main --state open --json number --jq '.[].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title"
            echo "import PR #$pr already open; it now runs up to ${tag#upstream/}"
            exit 0
          fi
          gh pr create --head upstream-stripped --base main \
            --title "$title" \
            --body "New upstream commits, rewritten by tools/cfgstrip. Merge with a merge commit, not a squash or rebase, so later imports keep a common base."
